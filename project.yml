name: BatteryTime
options:
  bundleIdPrefix: io.github.AnkanBiswas514
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  BatteryTimeCore:
    path: .
targets:
  BatteryTime:
    type: application
    platform: macOS
    sources:
      - path: Sources/BatteryTime
    dependencies:
      - package: BatteryTimeCore
        product: BatteryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.AnkanBiswas514.BatteryTime
        PRODUCT_NAME: BatteryTime
